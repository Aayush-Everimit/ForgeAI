spring:
  datasource:
    url: jdbc:h2:mem:forgeai_worker_test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration

forgeai:
  worker:
    scheduler-enabled: false
    lease-seconds: 10
    base-backoff-ms: 50
  rag:
    base-url: http://localhost:19998
    internal-token: test-internal-token
    connect-timeout-ms: 150
    read-timeout-ms: 150
    max-retries: 1
