server:
  port: ${API_PORT:4000}
  servlet:
    session:
      cookie:
        name: FORGEAI_SESSION
        http-only: true
        secure: ${COOKIE_SECURE:false}
        same-site: lax

spring:
  application:
    name: forgeai-api
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/forgeai}
    username: ${DATABASE_USERNAME:forgeai}
    password: ${DATABASE_PASSWORD:forgeai}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  security:
    oauth2:
      client:
        registration:
          github:
            client-id: ${GITHUB_OAUTH_CLIENT_ID:local-dev-github-client-id}
            client-secret: ${GITHUB_OAUTH_CLIENT_SECRET:local-dev-github-client-secret}
            scope: read:user,user:email

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true

forgeai:
  web:
    allowed-origins: ${WEB_ALLOWED_ORIGINS:http://localhost:3000}
  rag:
    base-url: ${RAG_BASE_URL:http://localhost:8000}
    internal-token: ${RAG_INTERNAL_TOKEN:local-dev-rag-internal-token}
    connect-timeout-ms: ${RAG_CONNECT_TIMEOUT_MS:2000}
    read-timeout-ms: ${RAG_READ_TIMEOUT_MS:5000}
    max-retries: ${RAG_MAX_RETRIES:2}
  security:
    kek-secret: ${FORGEAI_KEK_SECRET:local-dev-kek-secret-change-in-production-32b}
    kek-key-id: ${FORGEAI_KEK_KEY_ID:kek-v1}
    dev-auth-enabled: ${FORGEAI_DEV_AUTH_ENABLED:false}
