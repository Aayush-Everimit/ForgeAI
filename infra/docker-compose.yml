services:
  web:
    build:
      context: ../apps/web
    ports:
      - "3000:3000"

  api:
    build:
      context: ../services/api
    ports:
      - "4000:4000"
    env_file:
      - ../.env

  rag:
    build:
      context: ../services/rag
    ports:
      - "8000:8000"
    env_file:
      - ../.env

  jobs:
    build:
      context: ../workers/jobs
    env_file:
      - ../.env
